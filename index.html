<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atrapa la Moneda</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#202020;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace}
#gameContainer{position:relative;width:100vw;height:100vh;background:linear-gradient(to bottom,#87CEEB,#E0F6FF)}
canvas{width:100%;height:100%;display:block;cursor:none}
.btn{
  position:fixed;width:48px;height:48px;border:none;border-radius:50%;
  color:white;font-size:18px;cursor:pointer;z-index:100;
  box-shadow:0 4px 12px rgba(0,0,0,.35);transition:.2s
}
.btn:hover{transform:scale(1.1)}
#fullscreenBtn{top:16px;right:16px;background:linear-gradient(135deg,#667eea,#764ba2)}
#soundBtn{top:16px;right:72px;background:linear-gradient(135deg,#4caf50,#2e7d32)}
#pauseBtn{top:16px;right:128px;background:linear-gradient(135deg,#2196F3,#1565C0);display:none}
#shopBtn{top:16px;left:16px;background:linear-gradient(135deg,#ffa500,#ff6b00)}
#chatToggleBtn{bottom:16px;left:16px;background:linear-gradient(135deg,#667eea,#764ba2)}
#adminBtn{bottom:16px;right:16px;background:linear-gradient(135deg,#667eea,#764ba2);font-size:20px}

.shop-badge{
  position:absolute;top:-6px;right:-6px;background:#d32f2f;color:#fff;
  width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:bold;
  display:flex;align-items:center;justify-content:center
}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:none;justify-content:center;align-items:center;z-index:300
}
.modal.active{display:flex}
.modal-content{
  background:#1a1a1a;border:2px solid #ffa500;border-radius:14px;
  padding:24px;width:92%;max-width:900px;max-height:90vh;overflow-y:auto
}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:2px solid #ffa500;padding-bottom:12px}
.modal-header h2{color:#ffa500;font-size:24px}
.modal-close{background:none;border:none;color:#ffa500;font-size:26px;cursor:pointer}

.player-info{background:#252525;border:2px solid #667eea;border-radius:10px;padding:16px;margin-bottom:20px;display:flex;justify-content:space-around}
.player-stats{text-align:center}
.player-avatar{font-size:64px;margin-bottom:6px}
.stat-label{color:#87CEEB;font-size:12px;font-weight:bold}
.stat-value{color:#FFD700;font-size:20px;font-weight:bold}

.section-title{color:#ffa500;font-size:17px;margin:18px 0 12px;border-bottom:2px solid #ffa500;padding-bottom:6px}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.shop-item{
  background:#252525;border:2px solid #444;border-radius:10px;padding:12px;
  text-align:center;cursor:pointer;position:relative;transition:.2s
}
.shop-item:hover{border-color:#ffa500;transform:translateY(-3px)}
.shop-item.purchased{border-color:#4caf50;background:#1a3a1a}
.shop-item.equipped{border-color:#FFD700;background:#2a2a0a;box-shadow:0 0 16px rgba(255,215,0,.4)}
.item-emoji{font-size:42px;display:block;margin-bottom:4px}
.item-name{color:#87CEEB;font-size:11px;font-weight:bold;margin-bottom:4px}
.item-price{color:#FFD700;font-size:12px;font-weight:bold;margin-bottom:6px}
.item-btn{width:100%;padding:6px;border:none;border-radius:5px;font-size:11px;font-weight:bold;cursor:pointer}
.btn-buy{background:linear-gradient(135deg,#ffa500,#ff6b00);color:#fff}
.btn-buy:disabled{opacity:.45;cursor:not-allowed}
.btn-equipped{background:#4caf50;color:#fff}
.btn-equip{background:#2196F3;color:#fff}
.badge-new{position:absolute;top:4px;right:4px;background:#d32f2f;color:#fff;padding:2px 5px;border-radius:3px;font-size:9px;font-weight:bold}
.badge-popular{position:absolute;top:4px;right:4px;background:#ffa500;color:#000;padding:2px 5px;border-radius:3px;font-size:9px;font-weight:bold}

.chat-container{
  position:fixed;bottom:16px;left:16px;width:330px;height:460px;
  background:#1a1a1a;border:2px solid #667eea;border-radius:10px;
  display:flex;flex-direction:column;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.5)
}
.chat-container.hidden{display:none}
.chat-header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:12px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center;font-weight:bold}
.chat-close-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer}
.chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.chat-message{background:#252525;padding:8px 10px;border-radius:6px;border-left:3px solid #667eea}
.chat-message-header{display:flex;justify-content:space-between;margin-bottom:3px}
.chat-message-username{color:#87CEEB;font-size:11px;font-weight:bold}
.chat-message-badge{background:#FFD700;color:#000;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:bold}
.chat-message-time{color:#666;font-size:10px}
.chat-message-text{color:#fff;font-size:12px;word-break:break-word}
.chat-system{background:#0d47a1;border-left-color:#4caf50}
.chat-system .chat-message-username{color:#4caf50}
.chat-input-area{display:flex;gap:8px;padding:10px;background:#252525;border-top:1px solid #667eea}
.chat-input{flex:1;background:#1a1a1a;border:1px solid #667eea;color:#fff;padding:8px;border-radius:5px;font-size:12px}
.chat-send-btn{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;width:36px;height:36px;border-radius:5px;cursor:pointer}

.admin-panel{
  position:fixed;bottom:70px;right:16px;width:320px;background:#1a1a1a;
  border:2px solid #667eea;border-radius:10px;padding:16px;display:none;z-index:110;
  max-height:460px;overflow-y:auto
}
.admin-panel.active{display:block}
.admin-panel h2{color:#667eea;margin-bottom:12px;font-size:16px;border-bottom:2px solid #667eea;padding-bottom:8px}
.config-group{margin-bottom:10px;padding:10px;background:#252525;border-radius:8px;border-left:3px solid #667eea}
.config-group label{display:block;color:#87CEEB;font-size:11px;margin-bottom:5px;font-weight:bold}
.config-group input{width:100%;padding:6px;background:#1a1a1a;border:1px solid #667eea;color:#fff;border-radius:4px;font-size:12px}
.config-value{color:#FFD700;font-size:11px;margin-top:4px;font-weight:bold}
.button-group{display:flex;gap:8px;margin-top:8px}
.admin-btn{flex:1;padding:8px;border:none;border-radius:5px;color:#fff;cursor:pointer;font-size:12px;font-weight:bold}
.admin-btn-primary{background:linear-gradient(135deg,#667eea,#764ba2)}
.admin-btn-secondary{background:#444}
.admin-btn-danger{background:#d32f2f}

.particle{position:fixed;pointer-events:none;font-size:24px;animation:floatUp .9s ease-out forwards;z-index:40}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(.4)}}

.start-screen{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  z-index:50;cursor:pointer
}
.start-screen.hidden{display:none}
.game-title{font-size:clamp(32px,6.5vw,64px);color:#fff;margin-bottom:10px;text-shadow:0 4px 10px rgba(0,0,0,.3)}
.game-coin{font-size:clamp(46px,9vw,90px);margin:10px 0;animation:spin 2s linear infinite}
@keyframes spin{0%,100%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(1.1)}}
.start-instruction{font-size:clamp(14px,3vw,20px);color:rgba(255,255,255,.9);margin-top:18px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.highscore-text{color:#FFD700;font-size:clamp(13px,2.6vw,16px);margin-top:10px}

.pause-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.55);
  display:none;justify-content:center;align-items:center;
  z-index:45;color:#fff;font-size:42px;font-weight:bold;pointer-events:none
}
.pause-overlay.active{display:flex}
</style>
</head>
<body>

<div id="gameContainer">
  <div class="start-screen" id="startScreen">
    <div class="game-title">🎮 ATRAPA LA MONEDA</div>
    <div class="game-coin">🪙</div>
    <div class="start-instruction">Haz clic o presiona Espacio</div>
    <div class="highscore-text" id="startHighScore">🏆 Récord: 0</div>
  </div>
  <div class="pause-overlay" id="pauseOverlay">⏸ PAUSA</div>
  <canvas id="gameCanvas"></canvas>
</div>

<button class="btn" id="fullscreenBtn" title="Pantalla completa">⛶</button>
<button class="btn" id="soundBtn" title="Sonido">🔊</button>
<button class="btn" id="pauseBtn" title="Pausa">⏸</button>
<button class="btn" id="shopBtn" title="Tienda">🛍️<div class="shop-badge" id="shopBadge">0</div></button>
<button class="btn" id="chatToggleBtn" title="Chat">💬</button>
<button class="btn" id="adminBtn" title="Admin">⚙️</button>

<div class="modal" id="shopModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🛍️ Tienda</h2>
      <button class="modal-close" id="shopClose">✕</button>
    </div>
    <div class="player-info">
      <div class="player-stats"><div class="player-avatar" id="playerAvatar">👤</div><div class="stat-label">Avatar</div></div>
      <div class="player-stats"><div class="stat-value" id="playerCoins">0</div><div class="stat-label">Monedas</div></div>
      <div class="player-stats"><div class="player-avatar" id="playerBasket">🧺</div><div class="stat-label">Cesta</div></div>
    </div>
    <div class="section-title">👤 Avatares</div>
    <div class="items-grid" id="avatarsGrid"></div>
    <div class="section-title">🧺 Skins de Cesta</div>
    <div class="items-grid" id="skinsGrid"></div>
  </div>
</div>

<div class="chat-container" id="chatContainer">
  <div class="chat-header"><span>💬 Chat Global</span><button class="chat-close-btn" id="chatCloseBtn">✕</button></div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-area">
    <input type="text" id="chatInput" class="chat-input" placeholder="Escribe...">
    <button class="chat-send-btn" id="chatSendBtn">➤</button>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <h2>Panel Admin</h2>
  <div class="config-group"><label>Tiempo Inicial</label><input type="number" id="initialTime" value="30" min="5" max="120"><div class="config-value" id="initialTimeValue">30s</div></div>
  <div class="config-group"><label>Velocidad Inicial</label><input type="number" id="initialSpeed" value="4" min="1" max="20" step="0.5"><div class="config-value" id="initialSpeedValue">4</div></div>
  <div class="config-group"><label>Incremento</label><input type="number" id="speedIncrement" value="0.2" min="0.1" max="2" step="0.1"><div class="config-value" id="speedIncrementValue">0.2</div></div>
  <div class="config-group"><label>Puntos por moneda</label><input type="number" id="scorePerCoin" value="10" min="1" max="100"><div class="config-value" id="scorePerCoinValue">10</div></div>
  <div class="config-group"><label>Ancho cesta</label><input type="number" id="basketWidth" value="80" min="40" max="150"><div class="config-value" id="basketWidthValue">80</div></div>
  <div class="config-group"><label>Radio moneda</label><input type="number" id="coinRadius" value="15" min="5" max="30"><div class="config-value" id="coinRadiusValue">15</div></div>
  <div class="config-group">
    <div class="config-value" id="gameStatus">Estado: Parado</div>
    <div class="config-value" id="gameScore">Puntos: 0</div>
    <div class="config-value" id="gameTime">Tiempo: 0</div>
    <div class="config-value" id="gameCombo">Combo: x1</div>
  </div>
  <div class="button-group">
    <button class="admin-btn admin-btn-primary" id="applyBtn">Aplicar</button>
    <button class="admin-btn admin-btn-secondary" id="resetBtn">Reset</button>
  </div>
  <div class="button-group" style="margin-top:8px">
    <button class="admin-btn admin-btn-danger" id="clearBtn">Limpiar Todo</button>
  </div>
</div>

<script>
const CONFIG = {
  INITIAL_TIME: 30,
  INITIAL_COIN_SPEED: 4,
  SPEED_INCREMENT: 0.2,
  SCORE_PER_COIN: 10,
  FPS: 60,
  BASKET_WIDTH: 80,
  BASKET_HEIGHT: 22,
  COIN_RADIUS: 15
};

const SHOP_ITEMS = {
  avatars: [
    {id:'avatar1',name:'👤 Clásico',emoji:'👤',price:0,purchased:true},
    {id:'avatar2',name:'😎 Frío',emoji:'😎',price:150},
    {id:'avatar3',name:'🤖 Robot',emoji:'🤖',price:200},
    {id:'avatar4',name:'👑 Rey',emoji:'👑',price:300,popular:true},
    {id:'avatar5',name:'🧙 Mago',emoji:'🧙',price:250,new:true},
    {id:'avatar6',name:'🚀 Astronauta',emoji:'🚀',price:350}
  ],
  skins: [
    {id:'skin1',name:'🧺 Clásica',price:0,purchased:true, draw:(c,x,y,w,h)=>{c.fillStyle='#8B4513';c.fillRect(x,y,w,h);c.strokeStyle='#5c2d0c';c.lineWidth=3;c.strokeRect(x,y,w,h)}},
    {id:'skin2',name:'✨ Mágica',price:120,new:true, draw:(c,x,y,w,h)=>{const g=c.createLinearGradient(x,y,x+w,y);g.addColorStop(0,'#FF1493');g.addColorStop(.5,'#00BFFF');g.addColorStop(1,'#00FF7F');c.fillStyle=g;c.fillRect(x,y,w,h);c.strokeStyle='#FFD700';c.lineWidth=3;c.strokeRect(x,y,w,h)}},
    {id:'skin3',name:'🔥 Fuego',price:200, draw:(c,x,y,w,h)=>{const g=c.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#FFD700');g.addColorStop(.5,'#FF8C00');g.addColorStop(1,'#FF4500');c.fillStyle=g;c.fillRect(x,y,w,h);c.strokeStyle='#FF2400';c.lineWidth=3;c.strokeRect(x,y,w,h)}},
    {id:'skin4',name:'❄️ Hielo',price:180, draw:(c,x,y,w,h)=>{const g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#E0FFFF');g.addColorStop(.5,'#ADD8E6');g.addColorStop(1,'#00CED1');c.fillStyle=g;c.fillRect(x,y,w,h);c.strokeStyle='#00BFFF';c.lineWidth=3;c.strokeRect(x,y,w,h)}},
    {id:'skin5',name:'💎 Diamante',price:400,popular:true, draw:(c,x,y,w,h)=>{c.fillStyle='#E5E4E2';c.fillRect(x,y,w,h);c.strokeStyle='#B8860B';c.lineWidth=3;c.strokeRect(x,y,w,h);c.fillStyle='rgba(255,255,255,.7)';c.fillRect(x+5,y+3,8,8);c.fillRect(x+w-13,y+3,8,8)}},
    {id:'skin6',name:'🌈 Arcoíris',price:250, draw:(c,x,y,w,h)=>{const cols=['#FF0000','#FF7F00','#FFFF00','#00FF00','#0000FF','#8B00FF'];const sh=h/6;for(let i=0;i<6;i++){c.fillStyle=cols[i];c.fillRect(x,y+i*sh,w,sh)}c.strokeStyle='#FFD700';c.lineWidth=3;c.strokeRect(x,y,w,h)}},
    {id:'skin7',name:'💜 Neon',price:280,new:true, draw:(c,x,y,w,h)=>{c.fillStyle='#1a0033';c.fillRect(x,y,w,h);c.strokeStyle='#FF00FF';c.lineWidth=4;c.strokeRect(x,y,w,h);c.shadowColor='#FF00FF';c.shadowBlur=12;c.strokeRect(x+2,y+2,w-4,h-4);c.shadowBlur=0}},
    {id:'skin8',name:'☠️ Veneno',price:320, draw:(c,x,y,w,h)=>{const g=c.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#39FF14');g.addColorStop(1,'#006400');c.fillStyle=g;c.fillRect(x,y,w,h);c.strokeStyle='#00FF00';c.lineWidth=3;c.strokeRect(x,y,w,h)}},
    {id:'skin9',name:'🏆 Oro',price:500,popular:true, draw:(c,x,y,w,h)=>{const g=c.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#FFD700');g.addColorStop(.5,'#FFA500');g.addColorStop(1,'#B8860B');c.fillStyle=g;c.fillRect(x,y,w,h);c.strokeStyle='#FFF8DC';c.lineWidth=3;c.strokeRect(x,y,w,h)}},
    {id:'skin10',name:'🌌 Galaxy',price:380,new:true, draw:(c,x,y,w,h)=>{const g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#0B0B2A');g.addColorStop(.4,'#2E1A47');g.addColorStop(1,'#1A0A2E');c.fillStyle=g;c.fillRect(x,y,w,h);c.fillStyle='#fff';for(let i=0;i<7;i++){c.beginPath();c.arc(x+10+i*12,y+7+(i%3)*4,1.3,0,Math.PI*2);c.fill()}c.strokeStyle='#C77DFF';c.lineWidth=3;c.strokeRect(x,y,w,h)}},
    {id:'skin11',name:'💻 Hacker',price:340, draw:(c,x,y,w,h)=>{c.fillStyle='#001a00';c.fillRect(x,y,w,h);c.strokeStyle='#00FF41';c.lineWidth=3;c.strokeRect(x,y,w,h);c.fillStyle='#00FF41';c.font='10px monospace';c.fillText('01',x+6,y+14);c.fillText('10',x+w-22,y+14)}},
    {id:'skin12',name:'🔵 Fuego Azul',price:360, draw:(c,x,y,w,h)=>{const g=c.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#00E5FF');g.addColorStop(.5,'#2979FF');g.addColorStop(1,'#0D47A1');c.fillStyle=g;c.fillRect(x,y,w,h);c.strokeStyle='#80D8FF';c.lineWidth=3;c.strokeRect(x,y,w,h)}},
    {id:'skin13',name:'🪞 Cristal',price:420, draw:(c,x,y,w,h)=>{c.fillStyle='rgba(200,240,255,.7)';c.fillRect(x,y,w,h);c.strokeStyle='#E0F7FA';c.lineWidth=3;c.strokeRect(x,y,w,h);c.fillStyle='rgba(255,255,255,.5)';c.fillRect(x+4,y+3,12,8)}},
    {id:'skin14',name:'🖤 Oscura',price:300, draw:(c,x,y,w,h)=>{c.fillStyle='#111';c.fillRect(x,y,w,h);c.strokeStyle='#444';c.lineWidth=3;c.strokeRect(x,y,w,h)}}
  ]
};

const gameState = {
  score:0, highScore:0, timeLeft:30,
  isPlaying:false, isPaused:false,
  gameInterval:null, timerInterval:null,
  coins:1000, selectedAvatar:'avatar1', selectedSkin:'skin1',
  purchasedItems:{avatar1:true,skin1:true},
  combo:1, lastCatchTime:0, soundEnabled:true
};

const chatState = {username:`Jugador${Math.floor(Math.random()*1000)}`, isOwner:true, isOpen:true, unread:0};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gameContainer = document.getElementById('gameContainer');
const startScreen = document.getElementById('startScreen');
const pauseOverlay = document.getElementById('pauseOverlay');
const pauseBtn = document.getElementById('pauseBtn');
const soundBtn = document.getElementById('soundBtn');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  basket.y = canvas.height - 60;
}
resize();
window.addEventListener('resize', resize);

const basket = {x:0, y:0, width:80, height:22, targetX:0};
basket.x = canvas.width/2 - 40;
basket.targetX = basket.x;
basket.y = canvas.height - 60;

const coin = {x:0, y:-30, radius:15, speed:4, rotation:0};

function playSound(type) {
  if (!gameState.soundEnabled) return;
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    if (type==='catch'){o.frequency.value=780;g.gain.value=.08;o.start();o.stop(ac.currentTime+.08)}
    if (type==='over'){o.frequency.value=180;g.gain.value=.1;o.start();o.stop(ac.currentTime+.3)}
    if (type==='start'){o.frequency.value=520;g.gain.value=.08;o.start();o.stop(ac.currentTime+.1)}
  } catch(e){}
}

// Botones principales
document.getElementById('fullscreenBtn').onclick = () => {
  if (!document.fullscreenElement) gameContainer.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
};

soundBtn.onclick = () => {
  gameState.soundEnabled = !gameState.soundEnabled;
  soundBtn.textContent = gameState.soundEnabled ? '🔊' : '🔇';
  save();
};

pauseBtn.onclick = togglePause;

function togglePause() {
  if (!gameState.isPlaying) return;
  gameState.isPaused = !gameState.isPaused;
  pauseOverlay.classList.toggle('active', gameState.isPaused);
  pauseBtn.textContent = gameState.isPaused ? '▶' : '⏸';
}

// Tienda
const shopModal = document.getElementById('shopModal');
document.getElementById('shopBtn').onclick = () => shopModal.classList.add('active');
document.getElementById('shopClose').onclick = () => shopModal.classList.remove('active');
shopModal.onclick = e => { if (e.target === shopModal) shopModal.classList.remove('active'); };

function updateBadge() {
  let miss = 0;
  [...SHOP_ITEMS.avatars, ...SHOP_ITEMS.skins].forEach(i => {
    if (!gameState.purchasedItems[i.id] && i.price > 0) miss++;
  });
  const b = document.getElementById('shopBadge');
  b.textContent = miss;
  b.style.display = miss > 0 ? 'flex' : 'none';
}

function renderShop() {
  const aG = document.getElementById('avatarsGrid');
  const sG = document.getElementById('skinsGrid');
  aG.innerHTML = ''; sG.innerHTML = '';
  SHOP_ITEMS.avatars.forEach(i => aG.appendChild(makeItem(i,'avatar')));
  SHOP_ITEMS.skins.forEach(i => sG.appendChild(makeItem(i,'skin')));
  updatePlayer();
  updateBadge();
}

function makeItem(item, type) {
  const div = document.createElement('div');
  div.className = 'shop-item';
  if (gameState.purchasedItems[item.id]) div.classList.add('purchased');
  const selKey = type === 'avatar' ? 'selectedAvatar' : 'selectedSkin';
  if (gameState[selKey] === item.id) div.classList.add('equipped');

  let badge = '';
  if (item.new) badge = '<div class="badge-new">NUEVO</div>';
  if (item.popular) badge = '<div class="badge-popular">⭐</div>';

  const bought = gameState.purchasedItems[item.id];
  const equipped = gameState[selKey] === item.id;
  let btn = '';
  if (bought) {
    btn = equipped ? '<button class="item-btn btn-equipped">✓ EQUIPADO</button>'
                   : `<button class="item-btn btn-equip">Equipar</button>`;
  } else {
    const can = gameState.coins >= item.price;
    btn = `<button class="item-btn btn-buy" ${!can?'disabled':''}>${item.price}💰</button>`;
  }

  const emoji = type === 'skin' ? item.name.split(' ')[0] : item.emoji;
  div.innerHTML = `${badge}<span class="item-emoji">${emoji}</span>
    <div class="item-name">${item.name}</div>
    <div class="item-price">${item.price===0?'GRATIS':item.price+'💰'}</div>${btn}`;

  const button = div.querySelector('button');
  if (button) {
    button.onclick = (e) => {
      e.stopPropagation();
      if (bought) {
        if (!equipped) {
          gameState[selKey] = item.id;
          save(); renderShop();
        }
      } else if (gameState.coins >= item.price) {
        gameState.coins -= item.price;
        gameState.purchasedItems[item.id] = true;
        gameState[selKey] = item.id;
        save(); renderShop();
        addMsg('Sistema', `${chatState.username} compró un item! 🎉`, true);
      }
    };
  }
  return div;
}

function updatePlayer() {
  document.getElementById('playerCoins').textContent = gameState.coins;
  const av = SHOP_ITEMS.avatars.find(a => a.id === gameState.selectedAvatar);
  if (av) document.getElementById('playerAvatar').textContent = av.emoji;
  const sk = SHOP_ITEMS.skins.find(s => s.id === gameState.selectedSkin);
  if (sk) document.getElementById('playerBasket').textContent = sk.name.split(' ')[0];
}

function save() {
  localStorage.setItem('atrapaMoneda', JSON.stringify({
    coins: gameState.coins,
    selectedAvatar: gameState.selectedAvatar,
    selectedSkin: gameState.selectedSkin,
    purchasedItems: gameState.purchasedItems,
    highScore: gameState.highScore,
    soundEnabled: gameState.soundEnabled
  }));
}

function load() {
  const raw = localStorage.getItem('atrapaMoneda');
  if (raw) {
    const d = JSON.parse(raw);
    gameState.coins = d.coins ?? 1000;
    gameState.selectedAvatar = d.selectedAvatar || 'avatar1';
    gameState.selectedSkin = d.selectedSkin || 'skin1';
    gameState.purchasedItems = d.purchasedItems || {avatar1:true,skin1:true};
    gameState.highScore = d.highScore || 0;
    gameState.soundEnabled = d.soundEnabled !== false;
    soundBtn.textContent = gameState.soundEnabled ? '🔊' : '🔇';
  }
  document.getElementById('startHighScore').textContent = `🏆 Récord: ${gameState.highScore}`;
}
load();
renderShop();

// Chat
const chatContainer = document.getElementById('chatContainer');
const chatToggleBtn = document.getElementById('chatToggleBtn');
document.getElementById('chatCloseBtn').onclick = () => {
  chatState.isOpen = false;
  chatContainer.classList.add('hidden');
  chatToggleBtn.style.display = 'block';
};
chatToggleBtn.onclick = () => {
  chatState.isOpen = true;
  chatContainer.classList.remove('hidden');
  chatToggleBtn.style.display = 'none';
  chatState.unread = 0;
  document.getElementById('chatInput').focus();
};

function addMsg(user, text, sys=false) {
  const div = document.createElement('div');
  div.className = sys ? 'chat-message chat-system' : 'chat-message';
  const now = new Date();
  const t = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  if (sys) {
    div.innerHTML = `<div class="chat-message-header"><div class="chat-message-username">🔔 SISTEMA</div><div class="chat-message-time">${t}</div></div><div class="chat-message-text">${text}</div>`;
  } else {
    div.innerHTML = `<div class="chat-message-header"><div class="chat-message-username">${user} <span class="chat-message-badge">👑</span></div><div class="chat-message-time">${t}</div></div><div class="chat-message-text">${text}</div>`;
  }
  document.getElementById('chatMessages').appendChild(div);
  document.getElementById('chatMessages').scrollTop = 9999;
}

document.getElementById('chatSendBtn').onclick = sendChat;
document.getElementById('chatInput').onkeypress = e => { if (e.key==='Enter') sendChat(); };

function sendChat() {
  const inp = document.getElementById('chatInput');
  const txt = inp.value.trim();
  if (!txt) return;
  addMsg(chatState.username, txt);
  inp.value = '';
  if (Math.random() > .6) {
    setTimeout(() => {
      const r = ['¡Buen combo!','¡Sigue así!','¡A por el récord!','¡Vamos!','¡Loco!'];
      addMsg('Jugador'+Math.floor(Math.random()*900), r[Math.floor(Math.random()*r.length)]);
    }, 800);
  }
}
addMsg('Sistema', `¡Bienvenido ${chatState.username}! 👑`, true);

// Admin
document.getElementById('adminBtn').onclick = () => document.getElementById('adminPanel').classList.toggle('active');
document.getElementById('applyBtn').onclick = () => {
  CONFIG.INITIAL_TIME = +document.getElementById('initialTime').value;
  CONFIG.INITIAL_COIN_SPEED = +document.getElementById('initialSpeed').value;
  CONFIG.SPEED_INCREMENT = +document.getElementById('speedIncrement').value;
  CONFIG.SCORE_PER_COIN = +document.getElementById('scorePerCoin').value;
  CONFIG.BASKET_WIDTH = +document.getElementById('basketWidth').value;
  CONFIG.COIN_RADIUS = +document.getElementById('coinRadius').value;
  basket.width = CONFIG.BASKET_WIDTH;
  coin.radius = CONFIG.COIN_RADIUS;
};
document.getElementById('resetBtn').onclick = () => {
  document.getElementById('initialTime').value=30;
  document.getElementById('initialSpeed').value=4;
  document.getElementById('speedIncrement').value=0.2;
  document.getElementById('scorePerCoin').value=10;
  document.getElementById('basketWidth').value=80;
  document.getElementById('coinRadius').value=15;
};
document.getElementById('clearBtn').onclick = () => {
  if (confirm('¿Resetear todo?')) {
    gameState.isPlaying=false; gameState.isPaused=false;
    clearInterval(gameState.gameInterval); clearInterval(gameState.timerInterval);
    pauseOverlay.classList.remove('active');
    pauseBtn.style.display='none';
    resetGame(); resetCoin();
  }
};

setInterval(() => {
  document.getElementById('gameStatus').textContent = `Estado: ${gameState.isPlaying?(gameState.isPaused?'Pausado':'Jugando'):'Parado'}`;
  document.getElementById('gameScore').textContent = `Puntos: ${gameState.score}`;
  document.getElementById('gameTime').textContent = `Tiempo: ${gameState.timeLeft}`;
  document.getElementById('gameCombo').textContent = `Combo: x${gameState.combo}`;
  document.getElementById('playerCoins').textContent = gameState.coins;
}, 150);

// Juego
function resetCoin() {
  coin.y = -30;
  coin.x = Math.random() * (canvas.width - 40) + 20;
  coin.rotation = 0;
}
function resetGame() {
  gameState.score = 0;
  gameState.timeLeft = CONFIG.INITIAL_TIME;
  gameState.combo = 1;
  gameState.lastCatchTime = 0;
  coin.speed = CONFIG.INITIAL_COIN_SPEED;
}
function particles(x,y,n=6) {
  for (let i=0;i<n;i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = ['💰','✨','⭐','🪙'][Math.floor(Math.random()*4)];
    p.style.left = (x + (Math.random()-0.5)*50) + 'px';
    p.style.top = y + 'px';
    gameContainer.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }
}

function drawBasket() {
  basket.x += (basket.targetX - basket.x) * 0.22;
  const skin = SHOP_ITEMS.skins.find(s => s.id === gameState.selectedSkin);
  if (skin && skin.draw) skin.draw(ctx, basket.x, basket.y, basket.width, basket.height);
  else { ctx.fillStyle='#8B4513'; ctx.fillRect(basket.x,basket.y,basket.width,basket.height); }
}

function drawCoin() {
  ctx.save();
  ctx.translate(coin.x, coin.y);
  ctx.rotate(coin.rotation);
  ctx.beginPath(); ctx.arc(0,0,coin.radius,0,Math.PI*2);
  ctx.fillStyle='#FFD700'; ctx.fill();
  ctx.strokeStyle='#DAA520'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(-coin.radius/3,-coin.radius/3,coin.radius/3,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fill();
  ctx.restore();
}

function drawHUD() {
  const fs = Math.max(16, window.innerWidth*0.025);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(0,0,canvas.width,64);
  ctx.fillStyle = '#FFD700';
  ctx.font = `bold ${fs}px Arial`;
  ctx.textAlign = 'left';
  ctx.fillText(`💰 ${gameState.score}`, 16, 30);
  ctx.fillStyle = '#87CEEB';
  ctx.font = `${fs*0.7}px Arial`;
  ctx.fillText(`Combo x${gameState.combo}`, 16, 52);
  ctx.textAlign = 'right';
  ctx.fillStyle = gameState.timeLeft <= 5 ? '#FF6B6B' : '#FFD700';
  ctx.font = `bold ${fs}px Arial`;
  ctx.fillText(`⏱️ ${gameState.timeLeft}s`, canvas.width-16, 30);
  ctx.fillStyle = '#FFD700';
  ctx.font = `${fs*0.7}px Arial`;
  ctx.fillText(`🏆 ${gameState.highScore}`, canvas.width-16, 52);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,.75)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(32,window.innerWidth*0.06)}px Arial`;
  ctx.textAlign = 'center';
  ctx.fillText('¡TIEMPO!', canvas.width/2, canvas.height/3.3);
  ctx.fillStyle = '#FFD700';
  ctx.font = `bold ${Math.max(24,window.innerWidth*0.045)}px Arial`;
  ctx.fillText(`Puntuación: ${gameState.score}`, canvas.width/2, canvas.height/2.1);
  if (gameState.score >= gameState.highScore && gameState.score > 0) {
    ctx.fillStyle = '#4caf50';
    ctx.font = `${Math.max(16,window.innerWidth*0.03)}px Arial`;
    ctx.fillText('🎉 ¡NUEVO RÉCORD!', canvas.width/2, canvas.height/1.8);
  } else {
    ctx.fillStyle = '#87CEEB';
    ctx.font = `${Math.max(15,window.innerWidth*0.028)}px Arial`;
    ctx.fillText(`Récord: ${gameState.highScore}`, canvas.width/2, canvas.height/1.8);
  }
  ctx.fillStyle = '#ccc';
  ctx.font = `${Math.max(14,window.innerWidth*0.026)}px Arial`;
  ctx.fillText('Haz clic o Espacio para jugar de nuevo', canvas.width/2, canvas.height-80);
}

function checkHit() {
  return coin.y + coin.radius > basket.y &&
         coin.y - coin.radius < basket.y + basket.height &&
         coin.x > basket.x && coin.x < basket.x + basket.width;
}

function update() {
  if (!gameState.isPlaying || gameState.isPaused) return;
  coin.y += coin.speed;
  coin.rotation += 0.12;
  if (coin.y - coin.radius > canvas.height) {
    resetCoin();
    gameState.combo = 1;
  }
  if (checkHit()) {
    const now = Date.now();
    if (now - gameState.lastCatchTime < 1800) gameState.combo = Math.min(gameState.combo + 1, 12);
    else gameState.combo = 1;
    gameState.lastCatchTime = now;
    const pts = CONFIG.SCORE_PER_COIN * gameState.combo;
    gameState.score += pts;
    gameState.coins += pts;
    coin.speed += CONFIG.SPEED_INCREMENT;
    particles(coin.x, coin.y, 5 + Math.floor(gameState.combo/2));
    playSound('catch');
    resetCoin();
  }
}

function loop() {
  if (gameState.isPaused) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawHUD();
  drawBasket();
  drawCoin();
  update();
}

// Controles
canvas.addEventListener('mousemove', e => {
  if (!gameState.isPlaying || gameState.isPaused) return;
  const r = canvas.getBoundingClientRect();
  basket.targetX = e.clientX - r.left - basket.width/2;
  basket.targetX = Math.max(0, Math.min(basket.targetX, canvas.width - basket.width));
});
canvas.addEventListener('touchmove', e => {
  if (!gameState.isPlaying || gameState.isPaused) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  basket.targetX = e.touches[0].clientX - r.left - basket.width/2;
  basket.targetX = Math.max(0, Math.min(basket.targetX, canvas.width - basket.width));
}, {passive:false});

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space' || e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    if (!gameState.isPlaying) startGame();
    else togglePause();
  }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function handleKeys() {
  if (!gameState.isPlaying || gameState.isPaused) return;
  if (keys['arrowleft'] || keys['a']) basket.targetX -= 13;
  if (keys['arrowright'] || keys['d']) basket.targetX += 13;
  basket.targetX = Math.max(0, Math.min(basket.targetX, canvas.width - basket.width));
}

function startTimer() {
  gameState.timerInterval = setInterval(() => {
    if (gameState.isPaused) return;
    if (gameState.timeLeft > 0) gameState.timeLeft--;
    else endGame();
  }, 1000);
}

function endGame() {
  gameState.isPlaying = false;
  gameState.isPaused = false;
  clearInterval(gameState.gameInterval);
  clearInterval(gameState.timerInterval);
  pauseOverlay.classList.remove('active');
  pauseBtn.style.display = 'none';
  if (gameState.score > gameState.highScore) {
    gameState.highScore = gameState.score;
    document.getElementById('startHighScore').textContent = `🏆 Récord: ${gameState.highScore}`;
  }
  save();
  playSound('over');
  drawGameOver();
  startScreen.classList.remove('hidden');
  addMsg('Sistema', `${chatState.username} terminó con ${gameState.score} pts 🎯`, true);
}

function startGame() {
  startScreen.classList.add('hidden');
  resetGame();
  resetCoin();
  gameState.isPlaying = true;
  gameState.isPaused = false;
  pauseBtn.style.display = 'block';
  pauseBtn.textContent = '⏸';
  playSound('start');
  loop();
  startTimer();
  gameState.gameInterval = setInterval(() => {
    handleKeys();
    loop();
  }, 1000 / CONFIG.FPS);
  addMsg('Sistema', `${chatState.username} empezó 🎮`, true);
}

// Clics que sí funcionan
startScreen.addEventListener('click', startGame);
canvas.addEventListener('click', () => {
  if (!gameState.isPlaying) startGame();
});

// Iniciar
startScreen.classList.remove('hidden');
</script>
</body>
</html>
